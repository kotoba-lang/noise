name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The first-class runtime (ClojureScript) runs first deliberately: the JVM job
  # is the compat path, and a green JVM run alone would not prove the provider
  # this library actually ships on works.
  nbb:
    name: nbb (ClojureScript + @noble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch kotoba.bytes (sibling checkout, as nbb.edn's :local/root expects)
        run: git clone --depth 1 https://github.com/kotoba-lang/bytes ../bytes
      - run: npm install --no-audit --no-fund
      - run: npx nbb --classpath "src:test:../bytes/src" run-tests.cljs

  jvm:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint
